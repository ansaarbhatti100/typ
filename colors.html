<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Color Palettes | Bays Sports</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <style>
        .page-hero { height: 300px; background: #1a1a1a; display: flex; align-items: center; justify-content: center; color: #fff; text-align: center; }
        .color-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 20px; margin: 80px 0; }
        .color-swatch { border-radius: 15px; overflow: hidden; box-shadow: 0 5px 15px rgba(0,0,0,0.1); text-align: center; background: #fff; }
        .swatch-box { height: 120px; width: 100%; }
        .swatch-name { padding: 15px; font-weight: 700; font-size: 14px; text-transform: uppercase; }
    </style>
</head>
<body>
    <header>
        <div class="container header-content">
            <div class="logo"><a href="index.html" class="logo-text">BAYS <span>SPORTS</span></a></div>
            <nav class="nav-menu">
                <ul>
                    <li><a href="index.html">Home</a></li>
                    <li><a href="about.html">About Us</a></li>
                    <li><a href="contact.html">Contact</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <section class="page-hero">
        <div class="container">
            <h1>COLOR <span>PALETTES</span></h1>
            <p>Vibrant, Durable Colors for Every Discipline.</p>
        </div>
    </section>

    <section class="container">
        <div class="color-grid">
            <div class="color-swatch"><div class="swatch-box" style="background:#e10600;"></div><div class="swatch-name">Bays Red</div></div>
            <div class="color-swatch"><div class="swatch-box" style="background:#000000;"></div><div class="swatch-name">Deep Black</div></div>
            <div class="color-swatch"><div class="swatch-box" style="background:#ffffff; border:1px solid #eee;"></div><div class="swatch-name">Pure White</div></div>
            <div class="color-swatch"><div class="swatch-box" style="background:#003399;"></div><div class="swatch-name">Royal Blue</div></div>
            <div class="color-swatch"><div class="swatch-box" style="background:#ffcc00;"></div><div class="swatch-name">Athletic Gold</div></div>
            <div class="color-swatch"><div class="swatch-box" style="background:#006633;"></div><div class="swatch-name">Forest Green</div></div>
            <div class="color-swatch"><div class="swatch-box" style="background:#660099;"></div><div class="swatch-name">Pro Purple</div></div>
            <div class="color-swatch"><div class="swatch-box" style="background:#ff6600;"></div><div class="swatch-name">Vivid Orange</div></div>
        </div>
    </section>

    <footer class="main-footer" style="background:#000; color:#fff; padding: 40px 0; text-align:center;">
        <div class="container"><p>&copy; 2026 Bays Sports. All rights reserved.</p></div>
    </footer>
</body>
</html>
